limit_req_zone $binary_remote_addr zone=forge_flow_login:10m rate=5r/m;

server {
    listen 8081 default_server;
    listen [::]:8081 default_server;
    server_name _;

    access_log /var/log/nginx/forge-flow-access.log;
    error_log /var/log/nginx/forge-flow-error.log;
    server_tokens off;
    client_max_body_size 1m;
    limit_req_status 429;

    location = /login {
        limit_req zone=forge_flow_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
