spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:db}:${DB_PORT:5432}/${DB_NAME:forge_flow}
    username: ${DB_USER:forge}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update

server:
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        secure: ${SESSION_COOKIE_SECURE:true}

demo:
  security:
    access-code: ${DEMO_ACCESS_CODE}
  reset:
    enabled: ${DEMO_RESET_ENABLED:true}
    cron: "${DEMO_RESET_CRON:0 0 4 * * *}"
    zone: ${DEMO_RESET_ZONE:Asia/Shanghai}
