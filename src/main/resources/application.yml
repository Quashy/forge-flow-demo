spring:
  application:
    name: forge-flow-demo
  datasource:
    url: jdbc:h2:file:./data/forge-flow
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
  jackson:
    default-property-inclusion: non_null

server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
  error:
    include-message: never

demo:
  security:
    access-code: ${DEMO_ACCESS_CODE:forge-demo}
  seed:
    enabled: true
  reset:
    enabled: false
    cron: "0 0 4 * * *"
    zone: Asia/Shanghai
