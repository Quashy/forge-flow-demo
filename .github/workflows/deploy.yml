name: CI/CD

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: forge-flow-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test and verify image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run tests
        run: mvn -B test

      - name: Verify Docker image build
        run: docker build --tag forge-flow-demo:ci .

  publish:
    name: Publish container image
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Log in to GitHub Container Registry
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: Build and publish image
        env:
          IMAGE: ghcr.io/quashy/forge-flow-demo
          DATABASE_IMAGE: ghcr.io/quashy/forge-flow-postgres
          SOURCE_URL: https://github.com/${{ github.repository }}
        run: |
          docker build \
            --label "org.opencontainers.image.source=$SOURCE_URL" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --tag "$IMAGE:latest" \
            --tag "$IMAGE:sha-$GITHUB_SHA" \
            .
          docker push "$IMAGE:latest"
          docker push "$IMAGE:sha-$GITHUB_SHA"
          docker build \
            --file deploy/Dockerfile.postgres \
            --label "org.opencontainers.image.source=$SOURCE_URL" \
            --tag "$DATABASE_IMAGE:17-alpine" \
            .
          docker push "$DATABASE_IMAGE:17-alpine"

  deploy:
    name: Deploy to server
    if: github.event_name == 'push'
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    environment:
      name: production
      url: ${{ vars.DEPLOY_URL }}
    steps:
      - name: Deploy verified revision
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          GHCR_TOKEN: ${{ github.token }}
        run: |
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/forge-flow-deploy"
          chmod 600 "$HOME/.ssh/known_hosts" "$HOME/.ssh/forge-flow-deploy"

          printf '%s' "$GHCR_TOKEN" | ssh \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -i "$HOME/.ssh/forge-flow-deploy" \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "deploy $GITHUB_SHA"

          rm -f "$HOME/.ssh/forge-flow-deploy"
